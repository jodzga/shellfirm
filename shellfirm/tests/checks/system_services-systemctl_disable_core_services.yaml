---
- test: systemctl stop sshd
  expected_detection_ids:
    - system_services:systemctl_disable_core_services
  description: match systemctl stop sshd

- test: sudo systemctl disable firewalld
  expected_detection_ids:
    - system_services:systemctl_disable_core_services
  description: match systemctl disable firewalld with sudo

- test: sudo systemctl mask cron
  expected_detection_ids:
    - system_services:systemctl_disable_core_services
  description: match systemctl mask cron

- test: systemctl restart sshd
  expected_detection_ids: []
  description: should not match restart command

