---
- test: jcmd 1234 ManagementAgent.start
  expected_detection_ids:
    - java_jcmd:management_agent_start
  description: match basic ManagementAgent.start command

- test: jcmd 5678 ManagementAgent.start jmxremote.port=9999
  expected_detection_ids:
    - java_jcmd:management_agent_start
  description: match ManagementAgent.start with JMX port

- test: jcmd java-app ManagementAgent.start jmxremote.authenticate=false
  expected_detection_ids:
    - java_jcmd:management_agent_start
  description: match ManagementAgent.start with authentication disabled

- test: jcmd 1234 ManagementAgent.start jmxremote.ssl=false jmxremote.port=8080
  expected_detection_ids:
    - java_jcmd:management_agent_start
  description: match ManagementAgent.start with multiple parameters

- test: jcmd 1234 ManagementAgent.stop
  expected_detection_ids:
    - java_jcmd:management_agent_stop
  description: should match ManagementAgent.stop (different check)

- test: jcmd 1234 VM.version
  expected_detection_ids: []
  description: should not match safe VM commands

- test: ps aux | grep ManagementAgent
  expected_detection_ids: []
  description: should not match when ManagementAgent.start is not a jcmd command
